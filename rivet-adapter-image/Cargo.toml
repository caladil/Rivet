[package]
name = "rivetos-adapter-image"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rivet's A/B boot-slot port and its Raspberry Pi firmware implementor. ADR-014 §2."

[dependencies]
# `ADR-018` §4's partition numbers, the `Slot` they name, and the rule for
# composing a partition's device node all belong to `rivet-core::state` and are
# read from there rather than spelled again here (`ADR-011`). An adapter
# depending on the core is the direction the hexagon runs in; `ADR-014` §3's
# table forbids the reverse and forbids adapter -> adapter.
rivetos-core = { path = "../rivet-core" }

# NOTHING ELSE, and that is a consequence of the port rather than an omission
# (`ADR-009` §3 requires the reason for the step taken to be recorded).
#
# This crate makes no syscall. Mounting a FAT filesystem, reading a device-tree
# property and renaming a file over another are all below `port::BootMedium`, and
# the one implementor that exists is `cmd/rivet-initd`'s, over the `Kernel` port
# it already owns. So there is no `libc` here, no `nix`, and no `std::fs`:
#
#   libc         would be needed for a `StdBootMedium` of this crate's own —
#                `mount(2)` has no `std` equivalent. Deliberately not taken. The
#                only caller today is PID 1, which already has a syscall seam;
#                inventing a second one to sit beside it would be `ADR-011`'s
#                second authority over the same syscalls. When a process that is
#                NOT PID 1 needs to arm an update (`ADR-028` §4 leaves which
#                process open), that is the moment to decide whether the
#                implementor belongs here or at that caller's own seam.
#   tempfile     the `autoboot.txt` rewrite is write-temp-sync-rename with a
#                *derived* name, on a FAT filesystem, and the sequence is the
#                subject of this crate rather than an implementation detail of
#                it. See `rivet-store`'s Cargo.toml for the same rejection with
#                the same reasoning.
#
# The consequence for `ADR-010` §4: no new licence needs adding to deny.toml,
# because no new dependency was taken.

[lints.rust]
# Nothing here talks to the kernel — every syscall is below `port::BootMedium`,
# in whatever crate implements it. So, like `rivet-store` and unlike
# `cmd/rivet-initd` and `rivet-adapter-net`, this crate holds no `unsafe` at
# all and forbids it outright.
unsafe_code = "forbid"

[lints.clippy]
# Where this runs decides how hard the lints bite. `BootSlots::commit` is called
# from PID 1 (`ADR-017` §3.1.5 item 5), where `panic = "abort"` in the release
# profile makes a panic a kernel panic with no console and no stack trace.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lib]
# The PACKAGE is `rivetos-adapter-image` and the LIBRARY is `rivet_adapter_image`.
# ADR-033 §4: crates.io names and source names are different facts, and
# rivet.gg already owns the `rivet-*` package namespace.
name = "rivet_adapter_image"
path = "src/lib.rs"
