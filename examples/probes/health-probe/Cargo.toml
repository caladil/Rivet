# **The first application that answers a health question** — `ADR-045` §3.1,
# and the article `§11.1` steps 1 and 1a are proved with.
#
# It is one program with two behaviours, chosen by the name it is INSTALLED
# under — `tools/qemu/testapp`'s convention exactly, and for its reason: the two
# boots a proof needs must differ by one thing, and a second crate would differ
# by a whole build.
#
#   installed as `health-probe`        → it answers `degraded`, with a sentence
#   installed as anything with `wedge` → it answers `healthy` once and then
#                                        SIGSTOPs itself, which is a process
#                                        that is still there and never speaks
#                                        again
#
# The second is the case `ADR-045` §3.1.1 exists for and the one a telling
# design cannot report. Nothing here is a test double: it links the SDK an
# adopter links and answers on the descriptor a real supervisor hands over.
[workspace]

[package]
name = "health-probe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.rivet]
kind    = "daemon"
restart = "always"
# **`notify`, and only for the hint.** `ADR-045` §3.1.3 keeps `HEALTH=` on
# `NOTIFY_SOCKET` as *ask me now*, and a socket is only created for a service
# that declares this. Without it the probe still answers every poll; what it
# loses is the ability to be polled SOONER than the supervisor's interval, and
# a proof that had to wait a whole interval for a state change would be a proof
# nobody re-runs.
ready   = "notify"
listen  = []
library = []

[dependencies]
# The signal, for the wedge. `raise` would do, but `kill(getpid(), SIGSTOP)`
# says what it means: the whole thread group stops, including the thread that
# would otherwise answer.
libc = "0.2"
# **The SDK an adopter links.** The point of this probe is that the answering
# surface works as published, so a hand-rolled `accept` loop here would prove
# nothing about the thing under test.
rivetos-sdk = { path = "../../../rivet-sdk" }

[profile.release]
panic = "abort"
opt-level = "z"
strip = true
