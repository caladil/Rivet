<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enroll a passkey</title>
<style>
:root{color-scheme:light dark;--bg:#fbfbfa;--fg:#1c1c1a;--dim:#6a6a64;--line:#e2e2dd;--card:#fff;--accent:#8a5a2b;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#e8e8e4;--dim:#95958d;--line:#2b2b30;--card:#1e1e23;--accent:#d29a5e;--bad:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;padding:2.5rem 1rem;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:26rem;margin:0 auto;padding:1.5rem;border:1px solid var(--line);border-radius:10px;background:var(--card)}
h1{font-size:1.15rem;margin:0 0 1rem}
p{margin:0 0 1rem;color:var(--dim);font-size:.9rem}
label{display:block;font-size:.9rem;margin:0 0 .3rem}
input{font:1.1rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;width:100%;padding:.55rem .7rem;margin:0 0 1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);text-transform:uppercase;letter-spacing:.08em}
button{font:inherit;width:100%;padding:.7rem 1rem;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#said{min-height:1.5rem;margin:1rem 0 0;font-size:.9rem}
.bad{color:var(--bad)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Enroll a passkey for <span id="host"></span></h1>
<p>The first passkey needs the one-time code this machine issues over its control plane:
<code>cargo rivet run &lt;machine&gt; -- apply passkey-code confirm</code>. A browser already
signed in with a passkey can leave the code empty.</p>
<label for="code">One-time code</label>
<input id="code" autocomplete="one-time-code" spellcheck="false" placeholder="XXXXX-XXXXX">
<button id="go">Create a passkey</button>
<div id="said"></div>
<p style="margin-top:1rem"><a href="/sign-in">Sign in instead</a></p>
</main>
<script>
"use strict";
document.getElementById("host").textContent = location.hostname;
const said = document.getElementById("said");
function say(text, bad) { said.textContent = text; said.className = bad ? "bad" : ""; }
function enc(buf) {
  let s = ""; for (const b of new Uint8Array(buf)) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function dec(text) {
  const s = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" },
                               body: JSON.stringify(body || {}), credentials: "same-origin" });
  const text = await r.text();
  const data = text ? JSON.parse(text) : {};
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
document.getElementById("go").onclick = async () => {
  const button = document.getElementById("go");
  button.disabled = true;
  try {
    const code = document.getElementById("code").value.trim();
    say("Asking this machine for a challenge…");
    const o = await post("/.rivet/passkey/enroll/options", code ? { code } : {});
    say("Waiting for your authenticator…");
    const c = await navigator.credentials.create({ publicKey: {
      challenge: dec(o.challenge), rp: o.rp,
      user: { id: dec(o.user.id), name: o.user.name, displayName: o.user.displayName },
      pubKeyCredParams: o.pubKeyCredParams, authenticatorSelection: o.authenticatorSelection,
      attestation: o.attestation, timeout: o.timeout,
      excludeCredentials: o.excludeCredentials.map(id => ({ type: "public-key", id: dec(id) })) } });
    await post("/.rivet/passkey/enroll", {
      clientDataJSON: enc(c.response.clientDataJSON),
      attestationObject: enc(c.response.attestationObject) });
    say("Enrolled, and signed in. Opening this machine's index…");
    location.href = "/";
  } catch (e) {
    say(e.message || String(e), true);
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
