[package]
name = "rivetos-sysd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rivet's service supervisor. Allowed to fail; PID 1 restarts it. ADR-017."

[dependencies]
# **HDMI-CEC, for the display window's other half** - `ADR-039` §8.2, added
# 2026-09-02. `crate::runtime` publishes the hours for whoever holds the screen;
# `crate::display_hours` is the part the MACHINE can do itself, because a lease
# makes the panel unreachable and /dev/cecN is not in the lease.
rivetos-adapter-cec = { path = "../../rivet-adapter-cec" }

rivetos-core = { path = "../../rivet-core" }
rivetos-config = { path = "../../rivet-config" }

# Added 2026-08-23 with the first system service definitions. Two things are
# wanted from it and neither is a filesystem: `ConfigStore` is the one authority
# for **where** the machine layer is stored (`ADR-008` §3.1, `ADR-017` §3.1.9),
# and `ConfigStore::load` is the one place that says an absent document means a
# machine that has not been configured rather than a fault. Restating either
# here would be `ADR-011`'s second authority over the same fact — and the path
# is handed to `cmd/rivet-netd` on its command line, so a second spelling of
# it would be a machine reading a document nothing wrote.
#
# `ADR-014` §3: `cmd/*` may depend on everything and contains no logic. The
# store's own filesystem adapter is NOT used — see `src/document.rs` for the
# read-only adapter over this crate's `Kernel` port and why it exists.
rivetos-store = { path = "../../rivet-store" }

# Added 2026-08-25 for `ADR-018` §10.3's `/state` grow, which §10.7.3 rules the
# supervisor's: "cmd/rivet-sysd, as a one-shot before it converges any
# service." Every decision in it — the GPT arithmetic, the write order, the
# ext4 assessment — lives in that crate behind its own `GrowMedium` port, with
# a loop-device run behind it (§10.7). What this crate adds is the implementor:
# four ioctls and two descriptors at the libc wall in src/kernel.rs.
#
# `ADR-014` §3: `cmd/*` may depend on everything and contains no logic. The
# alternative — seven raw block-device primitives on this crate's own `Kernel`
# port — would oblige the fake to simulate a GPT in order to test decisions
# that are not this crate's, and `ADR-011` would then have two answers to what
# a grow does.
rivetos-adapter-image = { path = "../../rivet-adapter-image" }

# Added 2026-08-25 for `ADR-015` §4.2's launch-time verification, ruled that
# day. The supervisor now re-checks an application's signed header against the
# trust store before every spawn, which needs the same two primitives the
# installer uses — blake3 for the digests and Ed25519 for the header signature.
#
# It is the SAME verifier, deliberately: `ADR-028` §2 forbids two, and a launch
# check that agreed with the installer only by coincidence would be worse than
# none. Nothing here re-implements a comparison; `rivet_core::package` does
# all of it and this crate supplies the algorithms.
rivetos-crypto = { path = "../../rivet-crypto" }

# **The firewall's one table** - `ADR-023` §9. The policy is derived from the
# installed manifests, which this crate already reads to write the proxy's
# routing table, so this crate applies it in the same pass; the transaction,
# its acknowledgements and the read-back are `rivet-adapter-net`'s, and this
# crate's `Kernel` port only opens the socket. `ADR-014` §3: `cmd/*` may depend
# on everything.
rivetos-adapter-net = { path = "../../rivet-adapter-net" }

# **Issuing an application's certificate on a fleet-root machine** - `ADR-063`
# §4. The judging (does this leaf chain to this machine's root, is it near its
# end, does it carry the standard fields) and the signing are that crate's, and
# it is already on every card because PID 1 mints the root with it. This crate
# judges in its own loop with the root's public certificate alone; the signing
# runs only in the forked helper `Kernel::issue_in_child` starts, which is the
# one place the root's key is read.
rivetos-fleet-root = { path = "../../rivet-fleet-root" }

# The supervisor needs four things `std` does not offer: `signalfd(2)` so that
# SIGTERM and SIGCHLD are read from a descriptor rather than from a handler,
# `poll(2)` so that one wait can be bounded by the soonest backoff deadline,
# `kill(2)`, and `clock_gettime(CLOCK_MONOTONIC)` for a clock that does not jump
# when the Pi's absent RTC is corrected (ADR-021).
#
# The same survey `cmd/rivet-initd` recorded applies unchanged and is not
# repeated here: `rustix` does not implement signalfd, and its signal-disposition
# API is doc(hidden), unstable, and documented as unusable in a process that also
# has a libc present. Taking a second syscall vocabulary to cover one gap is
# worse than using `libc` alone, which on musl resolves against the libc `std`
# has already linked — so ADR-026 §3.1 still holds and no C cross-toolchain is
# needed. Walled per ADR-009 §3.4: no libc type appears outside src/kernel.rs.
libc = "0.2"

# Deliberately NOT here, with the reason recorded per ADR-009 §3:
#
#   serde / serde_json  The journal's on-disk form is line-delimited JSON
#                       (ADR-022 §3). It is written by hand in src/journal.rs
#                       because the encoder serialises a *closed* set of value
#                       types with no derive and no generic data model, and
#                       because rivet-config went to some length to keep serde
#                       out of this workspace (its Cargo.toml records why).
#                       ADR-022 §3.1 already puts the encoding behind a typed
#                       interface, so a compact binary form — or serde — can
#                       replace it without anything above noticing.
#   time                Would supply RFC 3339 formatting for the record's `ts`.
#                       Rejected for one dependency tree against ~25 lines of
#                       calendar arithmetic whose expectations are captured from
#                       GNU `date`, not from its own inverse. Ignition does not
#                       depend on `time` either, so AGENTS.md §8.4's
#                       "same major version as Ignition" constraint is not
#                       engaged. Worth revisiting if anything else needs dates.

[dev-dependencies]
# Tests only: to sign, with a test's own root, a leaf WITHOUT the standard
# fields — the shape a first boot minted before every leaf carried them — so
# the re-issue it triggers can be tested. The same version and features
# `rivet-fleet-root`'s own tests use; nothing here reaches a card.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }

[lints.rust]
# The supervisor talks to the kernel directly for signals, polling and the
# monotonic clock, and it must clear the child's signal mask between fork and
# exec — measured, not assumed: std does not do it (see src/kernel.rs). Every
# `unsafe` block carries a SAFETY comment and all of them are in src/kernel.rs.
unsafe_code = "allow"

[lints.clippy]
# Stricter than the workspace's `warn`. This process is *allowed* to fail, but
# `panic = "abort"` in the release profile means a panic is an abrupt death
# with no journal flush, so the discipline is the same as PID 1's.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[bin]]
# The PACKAGE is `rivetos-sysd` and the BINARY is `rivet-sysd`, which is what
# /system/bin holds and what an operator types. ADR-033 §4.
name = "rivet-sysd"
path = "src/main.rs"
